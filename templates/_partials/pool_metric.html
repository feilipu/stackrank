<form id="pool-metric" hx-post="/settings/pool-metric" hx-swap="outerHTML" hx-target="#pool-board"
      class="mt-3 flex flex-wrap items-center gap-3 text-sm">
   <span class="text-xs font-medium uppercase tracking-wide text-slate-500">Auto-eject metric</span>
   {% for value, label in [('outcome', 'Outcome'), ('elo', 'Elo'), ('blend', 'Blend')] %}
     <label class="inline-flex items-center gap-1">
       <input type="radio" name="metric" value="{{ value }}"
              {{ "checked" if pool_metric == value else "" }}
             onchange="this.form.requestSubmit()">
       {{ label }}
     </label>
   {% endfor %}
</form>
